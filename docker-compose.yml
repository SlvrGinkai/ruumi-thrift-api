services:
  api:
    build: .
    container_name: ruumi-api

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:17
    container_name: ruumi-postgres

    environment:
      POSTGRES_DB: ruumi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: ruumi-redis

    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: ruumi-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
